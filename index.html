<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Trazabilidad de Recepciones · MS Pastelería</title>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --line:#dde3ea; --line2:#e6ebf0;
  --navy:#1f4e79; --navy2:#2c5f8d; --ink:#1a2733; --ink2:#4a5866; --mut:#7c8a99;
  --ok:#1a7f37; --red:#c62828; --amber:#b26a00; --ext:#1f3a5f;
  --serie:#2a78d6;                     /* serie de la gráfica (paleta validada) */
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
/* ---------- acceso ---------- */
#gate{position:fixed;inset:0;background:linear-gradient(160deg,#1f4e79,#0f2942);display:flex;
      align-items:center;justify-content:center;padding:20px;z-index:50}
#gate .box{background:#fff;border-radius:14px;padding:26px;width:100%;max-width:370px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
#gate h1{margin:0 0 4px;font-size:17px;color:var(--navy)}
#gate p{margin:0 0 16px;font-size:12.5px;color:var(--ink2)}
#gate label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:12px 0 5px}
#gate select,#gate input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff}
#gate button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:9px;background:var(--navy);
      color:#fff;font-size:14px;font-weight:600;cursor:pointer}
#gate button[disabled]{opacity:.6;cursor:default}
#gerr{margin-top:11px;font-size:12.5px;color:var(--red);min-height:17px}
/* ---------- cabecera ---------- */
header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;justify-content:space-between;
       align-items:center;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:17px;letter-spacing:.2px}
header p{margin:4px 0 0;font-size:12px;opacity:.85}
header .who{font-size:12px;text-align:right;opacity:.95}
header .who button{margin-top:5px;background:rgba(255,255,255,.18);border:0;color:#fff;
       padding:5px 11px;border-radius:7px;font-size:12px;cursor:pointer}
.wrap{max-width:1400px;margin:0 auto;padding:16px 16px 60px}
/* ---------- pestañas ---------- */
.tabs{display:flex;gap:7px;margin:0 0 14px;flex-wrap:wrap}
.tab{padding:7px 16px;border-radius:999px;background:#fff;border:1px solid #ccd6e0;cursor:pointer;
     font-weight:600;font-size:13px;color:var(--ink2)}
.tab:hover{border-color:var(--navy2)}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* ---------- barra de filtros ---------- */
.toolbar{display:flex;gap:8px;align-items:center;margin:0 0 14px;flex-wrap:wrap;
         background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input,select,button.btn{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;
     background:#fff;color:var(--ink);font-family:inherit}
button.btn{cursor:pointer;font-weight:600;color:var(--navy);border-color:#ccd6e0}
button.btn:hover{background:#eef3f8}
.count{font-size:12px;color:var(--mut);margin-left:auto}
/* ---------- tarjetas KPI ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card .v{font-size:27px;font-weight:700;line-height:1.1}
.card .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-top:3px;font-weight:600}
.c-ok .v,.c-ok .k{color:var(--ok)} .c-rev .v,.c-rev .k{color:var(--red)}
.c-pro .v,.c-pro .k{color:var(--amber)} .c-ext .v,.c-ext .k{color:var(--ext)}
/* ---------- secciones ---------- */
.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px 17px;margin-bottom:16px}
.sec h2{margin:0 0 4px;font-size:15px;color:var(--navy)}
.sec .sh{font-size:12.5px;color:var(--ink2);margin:0 0 12px}
/* ---------- tablas ---------- */
table{width:100%;border-collapse:collapse;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
th{background:var(--navy2);color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
   padding:9px 10px;text-align:left;font-weight:600;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line2);font-size:13px;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.rowline{cursor:pointer}
.rowline:hover{background:#f7f9fb}
.det td{background:#f9fbfd}
.det table{border:0;border-radius:0}
.det th{background:#e8eef4;color:var(--navy);font-size:10.5px}
.det td{border-bottom:1px solid #eef2f6;font-size:12px}
.det h4{margin:11px 0 5px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--navy)}
.det h4:first-child{margin-top:2px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.b{font-weight:600}
.s-red{color:var(--red);font-weight:600}
.s-amber{color:var(--amber);font-weight:600}
.s-ok{color:var(--ok);font-weight:600}
.s-ext{color:var(--ext);font-weight:600}
.dif{font-weight:700}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10.5px;font-weight:600;
       background:#fde7ea;color:#b3234a;margin-left:6px;vertical-align:1px}
.caret{color:var(--navy2);width:14px;display:inline-block}
.note{font-size:12px;color:var(--ink2);margin-top:10px;line-height:1.55}
.empty{font-size:12.5px;color:var(--mut);padding:6px 2px}
.hide{display:none}
#gate.hide,#app.hide{display:none}
/* ---------- gráfica ---------- */
.sm{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px 22px;margin-top:4px}
.sm .t{font-size:12.5px;font-weight:600;color:var(--navy)}
.sm .c{font-size:11.5px;color:var(--mut);margin-bottom:7px}
.bars{display:flex;align-items:flex-end;gap:10px;height:92px;border-bottom:1px solid #c3cdd8}
.bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bval{font-size:11.5px;font-weight:600;margin-bottom:3px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.bar{width:100%;max-width:42px;background:var(--serie);border-radius:4px 4px 0 0}
.bar.z{background:#dde3ea}
.bax{display:flex;gap:10px;margin-top:5px}
.bax div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
details.tv{margin-top:12px}
details.tv summary{font-size:12px;color:var(--ink2);cursor:pointer}
footer{color:var(--mut);font-size:11.5px;text-align:center;padding:16px 0}
@media(max-width:820px){
  header{flex-direction:column;align-items:flex-start}header .who{text-align:left}
}
</style></head><body>

<div id="gate"><div class="box">
  <h1>Trazabilidad de Recepciones</h1>
  <p>MS Pastelería · acceso restringido</p>
  <label for="gu">Usuario</label>
  <select id="gu"></select>
  <label for="gp">Contraseña</label>
  <input id="gp" type="password" autocomplete="current-password" placeholder="••••••••">
  <button id="gb">Entrar</button>
  <div id="gerr" role="alert"></div>
</div></div>

<div id="app" class="hide">
<header>
  <div><h1>Trazabilidad de Recepciones por Sucursal</h1><p id="hsub"></p></div>
  <div class="who"><div id="whoami"></div><button id="salir">Salir</button></div>
</header>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Buscar folio, P#, S#, producto…" style="min-width:225px">
    <select id="fg">
      <option value="">Todos los estados</option>
      <option value="Revisar">A revisar</option>
      <option value="Vencido">Pendiente caducado</option>
      <option value="Proceso">Pendiente en proceso</option>
      <option value="OK">Cadena OK</option>
      <option value="Externo">Externa (proveedor)</option>
    </select>
    <select id="fp">
      <option value="cur">Mes actual</option>
      <option value="prev">Mes anterior</option>
      <option value="30">Últimos 30 días</option>
      <option value="7">Últimos 7 días</option>
      <option value="all">Todo el periodo</option>
      <option value="custom">Rango personalizado…</option>
    </select>
    <span id="rango" class="hide"><input type="date" id="d1"> <input type="date" id="d2"></span>
    <button class="btn" id="exp">⬇ Exportar a Excel</button>
    <span id="cnt" class="count"></span>
  </div>
  <div id="body"></div>
</div>
<footer>MS Pastelería · datos leídos de Odoo · página cifrada</footer>
</div>

/* ================= utilidades ================= */
const esc = t => String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const n = v => (v===null||v===undefined) ? "—" : (Math.round(v*100)/100).toLocaleString("es-MX");
const n0 = v => (v===null||v===undefined||Math.abs(v)<0.005) ? "—" : n(v);
const money = v => "$"+(Math.round(v*100)/100).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
const fecha = f => !f ? "—" : (f.slice(8,10)+"/"+f.slice(5,7)+"/"+f.slice(0,4)+(f.length>10?" "+f.slice(11,16):""));
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const mesLbl = m => MESES[parseInt(m.slice(5,7),10)-1]+" "+m.slice(2,4);
const estadoF = s => ({done:"Validado",cancel:"Cancelado",assigned:"Listo (no validado)",confirmed:"Por disponibilidad",
  waiting:"En espera",draft:"Borrador",partially_available:"Parc. disponible"}[s]||s);
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
/* toda diferencia distinta de cero es un problema: mismo color de alerta, con signo */
const dif = v => {if(v===null||v===undefined)return "—";
  if(Math.abs(v)<=0.005) return '0';
  return '<span class="dif s-red">'+(v>0?'+':'')+n(v)+'</span>';};
function claseEstado(st, grupo){
  if(grupo==="OK") return "s-ok";
  if(grupo==="Externo") return "s-ext";
  if(st.indexOf("Sobrante")===0 || st.indexOf("Pendiente")===0) return "s-amber";
  return "s-red";
}

/* ================= acceso ================= */
async function abrir(entry, pass){
  const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const aes = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(entry.salt), iterations:BOOT.enc.iters, hash:"SHA-256"},
    k, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(entry.iv)}, aes, b64(entry.ct));
  let txt;
  if(BOOT.enc.gz){
    if(typeof DecompressionStream === "undefined")
      throw new Error("Este navegador es demasiado antiguo para abrir el informe. Usa Chrome, Edge, Safari o Firefox actualizados.");
    const ds = new DecompressionStream("gzip");
    const w = ds.writable.getWriter(); w.write(new Uint8Array(plain)); w.close();
    txt = await new Response(ds.readable).text();
  } else txt = new TextDecoder().decode(plain);
  return JSON.parse(txt);
}
function arranca(data, quien){
  D = data;
  document.getElementById("gate").classList.add("hide");
  document.getElementById("app").classList.remove("hide");
  document.getElementById("whoami").textContent = quien + (D.meta.scope==="ALL" ? " · todas las sucursales" : " · "+D.meta.scope);
  document.getElementById("hsub").textContent =
    "Corte "+fecha(D.meta.corte)+" · ventana desde "+fecha(D.meta.desde)+" · "+D.kpis.folios.toLocaleString("es-MX")+
    " folios /IN/ · "+D.kpis.cadenas.toLocaleString("es-MX")+" cadenas · extraído "+D.meta.extraido+" (hora Cancún)";
  init();
}
if(BOOT.plain){ arranca(BOOT.plain, "Acceso público"); }
else{
  const sel=document.getElementById("gu");
  BOOT.enc.users.forEach((u,i)=>{const o=document.createElement("option");o.value=i;o.textContent=u.u;sel.appendChild(o);});
  const gb=document.getElementById("gb"), gp=document.getElementById("gp"), ge=document.getElementById("gerr");
  var entrar = async function(){
    ge.textContent=""; gb.disabled=true; gb.textContent="Abriendo…";
    try{ const e=BOOT.enc.users[+sel.value]; arranca(await abrir(e, gp.value), e.u); }
    catch(err){
      ge.textContent = (err&&err.message&&err.message.indexOf("navegador")>=0) ? err.message
                     : "Contraseña incorrecta para ese usuario.";
      gb.disabled=false; gb.textContent="Entrar"; gp.select();
    }
  };
  gb.onclick=entrar; gp.addEventListener("keydown",e=>{if(e.key==="Enter")entrar();}); gp.focus();
}
document.getElementById("salir").onclick=()=>location.reload();

/* ================= estado de filtros ================= */
let SUC="", Q="", G="", P="cur", DA="", DB2="";
function init(){
  const tabs=document.getElementById("tabs");
  const lista = D.meta.scope==="ALL" ? ["General"].concat(D.meta.sucs) : D.meta.sucs;
  SUC = lista[0]==="General" ? "" : lista[0];
  lista.forEach((s,i)=>{const d=document.createElement("div");d.className="tab"+(i===0?" on":"");d.textContent=s;
    d.onclick=()=>{[...tabs.children].forEach(c=>c.classList.remove("on"));d.classList.add("on");
      SUC=(s==="General"?"":s);render();};tabs.appendChild(d);});
  document.getElementById("q").oninput=e=>{Q=e.target.value.toLowerCase();render();};
  document.getElementById("fg").onchange=e=>{G=e.target.value;render();};
  document.getElementById("fp").onchange=e=>{P=e.target.value;
    document.getElementById("rango").classList.toggle("hide",P!=="custom");render();};
  document.getElementById("d1").onchange=e=>{DA=e.target.value;render();};
  document.getElementById("d2").onchange=e=>{DB2=e.target.value;render();};
  document.getElementById("exp").onclick=exportar;
  render();
}
function rangoFechas(){
  const hoy=D.meta.corte, dd=s=>new Date(s+"T00:00:00");
  if(P==="cur")  return [hoy.slice(0,7)+"-01","9999"];
  if(P==="prev"){const d=dd(hoy.slice(0,7)+"-01");d.setMonth(d.getMonth()-1);
    const a=d.toISOString().slice(0,7);return [a+"-01",a+"-31"];}
  if(P==="30"||P==="7"){const d=dd(hoy);d.setDate(d.getDate()-(+P));return [d.toISOString().slice(0,10),"9999"];}
  if(P==="custom") return [DA||"0000", DB2||"9999"];
  return ["0000","9999"];
}
function filtrados(){
  const r0=rangoFechas(), a=r0[0], b=r0[1];
  return D.rows.filter(r=>{
    if(SUC && r[9]!==SUC) return false;
    if(G && r[8]!==G) return false;
    const f=(r[0]||"").slice(0,10);
    if(f<a || f>b) return false;
    if(Q){const hay=((r[1]||"")+" "+(r[2]||"")+" "+r[11].map(x=>x[0]).join(" ")+" "+r[12].join(" ")+" "
      +r[14].map(d=>d[0]).join(" ")).toLowerCase(); if(!hay.includes(Q)) return false;}
    return true;
  });
}

/* ================= render ================= */
function render(){
  const rs=filtrados();
  document.getElementById("cnt").textContent = rs.length.toLocaleString("es-MX")+" cadenas en el filtro";
  const rev=rs.filter(r=>r[8]==="Revisar"||r[8]==="Vencido");
  const pro=rs.filter(r=>r[8]==="Proceso");
  const ok =rs.filter(r=>r[8]==="OK");
  const ext=rs.filter(r=>r[8]==="Externo");

  let h='<div class="cards">'
   + kpi(ok.length,  "Cadenas OK", "c-ok")
   + kpi(rev.length, "A revisar (caducados)", "c-rev")
   + kpi(pro.length, "Pendientes en proceso", "c-pro")
   + kpi(ext.length, "Externas (proveedor)", "c-ext")
   + '</div>';

  h+='<div class="sec"><h2>⚠ A revisar — discrepancias y pendientes caducados ('+rev.length+')</h2>'
   + '<p class="sh">La cadena no cuadra (tras devoluciones) o quedó un pendiente <b>vencido</b>. Clic en ▸ para ver el detalle. '
   + 'Diferencia = Recibido − (Enviado − Devuelto): negativo = faltante · positivo = sobrante/duplicación.</p>'
   + tablaCadenas(rev,"rev") + '</div>';

  h+='<div class="sec"><h2>⏳ Pendientes de recibir — en proceso, no vencidos ('+pro.length+')</h2>'
   + '<p class="sh">Traspasos enviados cuya recepción /IN/ está programada para hoy o a futuro. Orden por fecha descendente.</p>'
   + tablaPendientes(pro) + '</div>';

  h+='<div class="sec"><h2>📈 Tendencia mensual de casos a revisar</h2>'
   + '<p class="sh">Cadenas con discrepancia o pendiente vencido, por mes. No depende del filtro de fechas: siempre muestra toda la ventana.</p>'
   + tendencia() + '</div>';

  if(!SUC && D.resumen.length>1)
    h+='<div class="sec"><h2>📊 Resumen por sucursal</h2>'+tablaResumen()+'</div>';

  h+='<div class="sec"><h2>✅ Cadenas correctas ('+ok.length+')</h2>'
   + '<p class="sh">Enviado − devuelto = recibido. Clic en ▸ para ver folios y envíos.</p>'
   + tablaCadenas(ok,"ok",400) + '</div>';

  h+='<div class="sec"><h2>🏭 Compras a proveedor ('+ext.length+')</h2>'
   + '<p class="sh">Recepciones sin traspaso entre sucursales: no aplica el cuadre enviado/recibido.</p>'
   + tablaCadenas(ext,"ext",400) + '</div>';

  h+='<div class="sec"><h2>Clasificación de folios y método</h2>'+claseYmetodo()+'</div>';

  const B=document.getElementById("body");
  B.innerHTML=h;
  B.querySelectorAll("tr.rowline").forEach(tr=>tr.onclick=()=>{
    const d=B.querySelector('tr[data-d="'+tr.dataset.i+'"]');
    if(!d) return;
    d.classList.toggle("hide");
    tr.querySelector(".caret").textContent = d.classList.contains("hide")?"▸":"▾";
  });
}
const kpi=(v,k,c)=>'<div class="card '+c+'"><div class="v">'+v.toLocaleString("es-MX")+'</div><div class="k">'+k+'</div></div>';

function tablaCadenas(rs, pref, tope){
  if(!rs.length) return '<div class="empty">Sin casos con estos filtros.</div>';
  const cap = tope ? rs.slice(0,tope) : rs;
  let t='<table><thead><tr><th style="width:22px"></th><th>Sucursal</th><th>Compra</th><th>Fecha</th>'
   +'<th>Estado cadena</th><th>Venta</th><th class="n">Enviado</th><th class="n">Devuelto</th>'
   +'<th class="n">Recibido</th><th class="n">Dif.</th></tr></thead><tbody>';
  cap.forEach((r,i)=>{
    const id=pref+i;
    const cad = (r[8]==="Vencido") ? '<span class="badge">caducado</span>' : '';
    t+='<tr class="rowline" data-i="'+id+'"><td><span class="caret">▸</span></td>'
      +'<td>'+esc(r[9])+'</td><td class="mono b">'+esc(r[1])+'</td><td>'+fecha(r[0])+'</td>'
      +'<td><span class="'+claseEstado(r[7],r[8])+'">'+esc(r[7])+'</span>'+cad+'</td>'
      +'<td class="mono">'+esc(r[2])+'</td><td class="n">'+n(r[3])+'</td><td class="n">'+n0(r[4])+'</td>'
      +'<td class="n">'+n(r[5])+'</td><td class="n">'+dif(r[6])+'</td></tr>'
      +'<tr class="det hide" data-d="'+id+'"><td></td><td colspan="9">'+detalle(r)+'</td></tr>';
  });
  t+='</tbody></table>';
  if(tope && rs.length>tope)
    t+='<div class="note">Mostrando '+tope+' de '+rs.length.toLocaleString("es-MX")+'. Afina el filtro o usa el botón de exportar para verlas todas.</div>';
  return t;
}

function tablaPendientes(rs){
  if(!rs.length) return '<div class="empty">No hay pendientes en proceso.</div>';
  let t='<table><thead><tr><th>Fecha</th><th>Sucursal</th><th>Compra</th><th>Venta</th><th>Envío /OUT/</th>'
   +'<th>Recepción /IN/ · fecha</th><th class="n">Enviado</th><th class="n">Recibido</th></tr></thead><tbody>';
  rs.forEach(r=>{
    const ins = r[11].map(f=>'<span class="mono">'+esc(f[0])+'</span> · <span style="color:var(--mut)">'+fecha(f[2])+'</span>').join('<br>');
    t+='<tr><td>'+fecha(r[0])+'</td><td>'+esc(r[9])+'</td><td class="mono b">'+esc(r[1])+'</td>'
      +'<td class="mono">'+esc(r[2])+'</td><td class="mono">'+(r[12].map(esc).join('<br>')||'—')+'</td>'
      +'<td>'+ins+'</td><td class="n">'+n(r[3])+'</td><td class="n">'+n(r[5])+'</td></tr>';
  });
  return t+'</tbody></table>';
}

function tablaResumen(){
  let t='<table><thead><tr><th>Sucursal</th><th class="n">Folios</th><th class="n">Validados</th>'
   +'<th class="n">Cancelados</th><th class="n">Pendientes</th><th class="n">Cadenas</th><th class="n">OK</th>'
   +'<th class="n">A revisar</th><th class="n">En proceso</th><th class="n">Unidades</th><th class="n">Importe OC</th></tr></thead><tbody>';
  D.resumen.forEach(r=>{
    t+='<tr><td class="b">'+esc(r.suc)+'</td><td class="n">'+n(r.folios)+'</td><td class="n">'+n(r.validados)+'</td>'
     +'<td class="n">'+n(r.cancelados)+'</td><td class="n">'+n(r.pendientes)+'</td><td class="n">'+n(r.cadenas)+'</td>'
     +'<td class="n">'+n(r.ok)+'</td><td class="n">'+(r.revisar?'<span class="s-red">'+r.revisar+'</span>':'0')+'</td>'
     +'<td class="n">'+n(r.proceso)+'</td><td class="n">'+n(r.unidades)+'</td><td class="n">'+money(r.importe)+'</td></tr>';
  });
  return t+'</tbody></table><div class="note">Este resumen abarca toda la ventana de datos, no el filtro de fechas. '
   +'<b>Importe OC</b> = suma del total de las órdenes de compra asociadas.</div>';
}

function detalle(r){
  let s='<h4>Recepciones</h4><table><thead><tr><th>Folio</th><th>Estado</th><th>Programada</th><th>Validada</th><th>Clasificación</th></tr></thead><tbody>';
  r[11].forEach(f=>{s+='<tr><td class="mono">'+esc(f[0])+'</td><td>'+estadoF(f[1])+'</td><td>'+fecha(f[2])
    +'</td><td>'+fecha(f[3])+'</td><td>'+esc(f[4])+'</td></tr>';});
  s+='</tbody></table>';
  if(r[14] && r[14].length){
    s+='<h4>Diferencia por producto</h4><table><thead><tr><th>Producto</th><th class="n">Debió llegar</th>'
      +'<th class="n">Llegó</th><th class="n">Diferencia</th></tr></thead><tbody>';
    r[14].forEach(d=>{s+='<tr><td>'+esc(d[0])+'</td><td class="n">'+n(d[1])+'</td><td class="n">'+n(d[2])
      +'</td><td class="n">'+dif(d[3])+'</td></tr>';});
    s+='</tbody></table>';
  }
  if(r[12] && r[12].length) s+='<h4>Envíos /OUT/</h4><div class="mono">'+r[12].map(esc).join(" · ")+'</div>';
  if(r[13]==="Externo") s+='<div class="note">Compra directa a proveedor: no hay envío desde otra sucursal, por eso no aplica el cuadre de traspaso.</div>';
  if(r[15]) s+='<div class="note">'+esc(r[15])+'</div>';
  if(r[10]) s+='<div class="note">Importe de la orden de compra: '+money(r[10])+'</div>';
  return s;
}

function tendencia(){
  const T=D.trend, sucs=(SUC?[SUC]:D.meta.sucs).filter(s=>T[s]), meses=D.meta.meses;
  if(!sucs.length || !meses.length) return '<div class="empty">Sin datos para graficar.</div>';
  let max=1; sucs.forEach(s=>meses.forEach(m=>{const c=T[s][m]; if(c&&c[1]>max)max=c[1];}));
  let h='<div class="sm"'+(sucs.length===1?' style="max-width:340px"':'')+'>';
  sucs.forEach(s=>{
    const tot=meses.reduce((a,m)=>a+((T[s][m]||[0,0,0])[1]),0);
    h+='<div><div class="t">'+esc(s)+'</div><div class="c">'+tot+' en el periodo</div><div class="bars">';
    meses.forEach(m=>{const c=T[s][m]||[0,0,0], v=c[1];
      h+='<div class="bcol" title="'+esc(s)+' · '+mesLbl(m)+': '+v+' a revisar de '+c[0]+' cadenas">'
       +'<div class="bval">'+v+'</div><div class="bar'+(v?'':' z')+'" style="height:'+(v?Math.max(Math.round(v/max*100),3):1)+'%"></div></div>';});
    h+='</div><div class="bax">'+meses.map(m=>'<div>'+mesLbl(m)+'</div>').join('')+'</div></div>';
  });
  h+='</div><details class="tv"><summary>Ver los mismos datos en tabla</summary><table style="margin-top:8px"><thead><tr><th>Sucursal</th>'
   +meses.map(m=>'<th class="n">'+mesLbl(m)+'</th>').join('')+'</tr></thead><tbody>';
  sucs.forEach(s=>{h+='<tr><td>'+esc(s)+'</td>'+meses.map(m=>'<td class="n">'+((T[s][m]||[0,0,0])[1])+'</td>').join('')+'</tr>';});
  return h+'</tbody></table></details>';
}

function claseYmetodo(){
  let h='<table style="max-width:430px"><thead><tr><th>Categoría de folio</th><th class="n">Folios</th></tr></thead><tbody>';
  ["Correcto","Duplicado correcto","Duplicado no cuadra","Error/Pendiente"].forEach(k=>{
    if(D.cats[k]!==undefined) h+='<tr><td>'+k+'</td><td class="n">'+n(D.cats[k])+'</td></tr>';});
  h+='</tbody></table><div class="note">“Duplicado correcto” son entregas parciales (backorders) o un folio cancelado más otro válido que sí cuadran.<br><br>'
   +'<b>Cadena verificada:</b> Compra (P#) → Venta inter-compañía (S#) → Envío /OUT/ → Recepción /IN/ → Devolución /RET/, '
   +'con la regla <b>enviado − devuelto = recibido</b>.<br>'
   +'<b>Reglas de error:</b> duplicación de inventario, faltante, sobrante, salió-y-no-se-recibió, recibido-sin-salida, '
   +'pendiente vencido (fecha anterior a hoy) y <b>sucursal cerrada</b>: AV135 cerró el 24-jun-2026 (sustituida por Jardines, '
   +'abierta el 7-jul-2026), así que cualquier movimiento posterior se marca como error.</div>';
  return h;
}

/* ================= exportar ================= */
function exportar(){
  const rs=filtrados();
  const cab=["Fecha","Sucursal","Compra","Venta","Tipo","Enviado","Devuelto","Recibido","Diferencia","Estado cadena",
             "Grupo","Importe OC","Folios","Envios","Producto","Debio llegar","Llego","Dif producto"];
  const q=v=>{const s=(v===null||v===undefined)?"":String(v);return '"'+s.replace(/"/g,'""')+'"';};
  const li=[cab.map(q).join(";")];
  rs.forEach(r=>{
    const base=[r[0],r[9],r[1],r[2],r[13],r[3],r[4],r[5],r[6],r[7],r[8],r[10],
                r[11].map(f=>f[0]).join(" | "), r[12].join(" | ")];
    if(r[14] && r[14].length) r[14].forEach(d=>li.push(base.concat([d[0],d[1],d[2],d[3]]).map(q).join(";")));
    else li.push(base.concat(["","","",""]).map(q).join(";"));
  });
  const blob=new Blob(["﻿"+li.join("\r\n")],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="recepciones_"+(SUC||"todas").replace(/[^0-9A-Za-zÁÉÍÓÚÑáéíóúñ]+/g,"_")+"_"+D.meta.corte+".csv";
  a.click(); URL.revokeObjectURL(a.href);
}
